# Delivers ORBIT Telegram alerts: each run calls the cron endpoint once a minute for ~5 minutes,
# and a new run starts every 5 minutes, so alerts go out roughly every minute.
name: ORBIT alerts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: orbit-alerts
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tick every minute
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS --max-time 55 https://www.orbitonsol.com/api/cron?wait=1 || true
            curl -fsS --max-time 58 https://www.orbitonsol.com/api/picks/refresh?wait=1 || true
            echo
            if [ "$i" -lt 5 ]; then sleep 30; fi
          done
